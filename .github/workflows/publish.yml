name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Check that the tag matches the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qxF "version = \"$version\"" pyproject.toml \
            || { echo "::error::pyproject.toml doesn't have version $version"; exit 1; }
          grep -qxF "__version__ = \"$version\"" finland2mc/__init__.py \
            || { echo "::error::finland2mc/__init__.py doesn't have version $version"; exit 1; }
      - run: uv run --python 3.13 pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/finland2mc
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
